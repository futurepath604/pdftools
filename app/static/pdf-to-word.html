<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Word Converter - FILEORA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/static/js/branding.js" defer></script>
    <script src="/static/js/ads-manager.js" defer></script>
    <style>
        .tool-container { max-width: 700px; margin: 50px auto; }
        .upload-box { border: 2px dashed #0dcaf0; border-radius: 12px; background: #f8f9fa; padding: 40px; text-align: center; transition: 0.3s; cursor: pointer; }
        .upload-box:hover { background: #e9ecef; border-color: #0bacbe; }
        .upload-icon { font-size: 48px; color: #0dcaf0; margin-bottom: 15px; }
    </style>
</head>
<body class="bg-light">
    <div id="header-ad" class="container mt-2"></div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold brand-title" href="/">📄 FILEORA</a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fas fa-home"></i> All Tools</a>
        </div>
    </nav>

    <div class="container tool-container">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <h1 class="h2 fw-bold text-dark"><i class="fas fa-file-word text-info me-2"></i>PDF to Word Converter</h1>
                <p class="text-muted">Convert your PDF documents to editable Word (.docx) files.</p>
            </div>

            <form id="toolForm">
                <div class="upload-box mb-4" onclick="document.getElementById('pdfFile').click()">
                    <div class="upload-icon"><i class="fas fa-file-arrow-up"></i></div>
                    <h5 class="fw-bold">Upload PDF or <span class="text-info">Browse</span></h5>
                    <input class="d-none" type="file" id="pdfFile" accept=".pdf" required>
                </div>
                <div id="fileInfo" class="alert alert-secondary d-none mb-3"><span id="fileName"></span></div>
                <button type="submit" id="submitBtn" class="btn btn-info text-white btn-lg w-100 fw-bold py-3 shadow-sm" disabled>Convert to Word</button>
            </form>
            <div id="loading" class="text-center mt-4 d-none">
                <div class="spinner-border text-info" role="status"></div>
                <p class="text-muted mt-2 fw-bold">Converting to Word document...</p>
            </div>
            <div id="tool-box-ad" class="mt-4"></div>
        </div>
    </div>
    <div id="footer-ad" class="container mb-3"></div>
    <footer class="bg-dark text-white text-center py-4 mt-5"><p class="footer-text mb-0">© 2026 Fileora Technologies.</p></footer>

    <script>
        const fileInput = document.getElementById('pdfFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const toolForm = document.getElementById('toolForm');
        const loading = document.getElementById('loading');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = e.target.files[0].name;
                fileInfo.classList.remove('d-none');
                submitBtn.removeAttribute('disabled');
            }
        });

        toolForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            const formData = new FormData(); formData.append('file', file);
            submitBtn.classList.add('d-none'); loading.classList.remove('d-none');

            try {
                const response = await fetch('/api/tools/pdf-to-word', { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Conversion failed.');
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `${file.name.replace('.pdf','')}.docx`;
                document.body.appendChild(a); a.click(); a.remove();
                alert('Converted and downloaded successfully!'); location.reload();
            } catch (err) { alert(err.message); submitBtn.classList.remove('d-none'); loading.classList.add('d-none'); }
        });
    </script>
</body>
</html>
