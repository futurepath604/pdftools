<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compress PDF Online - FILEORA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/static/js/branding.js" defer></script>
    <script src="/static/js/ads-manager.js" defer></script>
    <style>
        .tool-container { max-width: 700px; margin: 50px auto; }
        .upload-box { border: 2px dashed #0d6efd; border-radius: 12px; background: #f8f9fa; padding: 40px; text-align: center; transition: 0.3s; cursor: pointer; }
        .upload-box:hover { background: #e9ecef; border-color: #0b5ed7; }
        .upload-icon { font-size: 48px; color: #0d6efd; margin-bottom: 15px; }
    </style>
</head>
<body class="bg-light">
    <div id="header-ad" class="container mt-2"></div>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold brand-title" href="/">📄 FILEORA</a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fas fa-home"></i> All Tools</a>
        </div>
    </nav>

    <div class="container tool-container">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <h1 class="h2 fw-bold text-dark"><i class="fas fa-compress-arrows-alt text-primary me-2"></i>Compress PDF File</h1>
                <p class="text-muted">Reduce your PDF file size instantly while retaining maximum quality.</p>
            </div>

            <form id="toolForm">
                <div class="upload-box mb-4" onclick="document.getElementById('pdfFile').click()">
                    <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <h5 class="fw-bold">Drag & drop your PDF here or <span class="text-primary">Browse</span></h5>
                    <p class="text-muted small mb-0">Supports PDF files up to 100MB</p>
                    <input class="d-none" type="file" id="pdfFile" accept=".pdf" required>
                </div>

                <div id="fileInfo" class="alert alert-secondary d-none mb-3">
                    <i class="fas fa-file-pdf me-2"></i><span id="fileName"></span>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 fw-bold py-3 shadow-sm" disabled>
                    <i class="fas fa-cogs me-2"></i>Compress PDF Now
                </button>
            </form>

            <div id="loading" class="text-center mt-4 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2 fw-bold">Processing your file securely, please wait...</p>
            </div>
            
            <div id="tool-box-ad" class="mt-4"></div>
        </div>
    </div>

    <div id="footer-ad" class="container mb-3"></div>
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="footer-text mb-0">© 2026 Fileora Technologies. All rights reserved.</p>
    </footer>

    <script>
        const fileInput = document.getElementById('pdfFile');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const toolForm = document.getElementById('toolForm');
        const loading = document.getElementById('loading');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = e.target.files[0].name;
                fileInfo.classList.remove('d-none');
                submitBtn.removeAttribute('disabled');
            }
        });

        toolForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            submitBtn.classList.add('d-none');
            loading.classList.remove('d-none');

            try {
                const response = await fetch('/api/tools/compress', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Conversion failed on server.');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `compressed_${file.name}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                alert('Success! Your file has been compressed and downloaded.');
                location.reload();
            } catch (err) {
                alert(err.message);
                submitBtn.classList.remove('d-none');
                loading.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
